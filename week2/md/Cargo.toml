[package]
name = "md"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep debug info in release builds so a sampling profiler (sample, Instruments,
# perf) can name the crate's functions instead of raw addresses.
[profile.release]
debug = true
