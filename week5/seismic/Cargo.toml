[package]
name = "week5-seismic"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["enzyme"]
enzyme = []

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[[bin]]
name = "seismic"
path = "src/main.rs"
test = false
